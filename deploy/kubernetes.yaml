# hushgate on Kubernetes.
#
#   kubectl apply -f deploy/kubernetes.yaml
#
# One replica on purpose. Each instance keeps its own hash-chained audit trail
# and its own in-memory quota counters, so scaling out means either one volume
# and one trail per pod, or an external aggregator. Decide that deliberately
# rather than by editing a number here.
#
# Both upstreams are checked against residency.allow before the listener binds,
# and both are always configured — omitting one from the ConfigMap only falls
# back to the official endpoint, it does not switch the route off. So each needs
# an allowlist entry with a legal basis you have actually assessed. The Anthropic
# entry below is a third-country transfer: assess it, or point upstreams.anthropic
# at an EU endpoint and narrow the entry to match.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hushgate-config
  labels:
    app.kubernetes.io/name: hushgate
data:
  hushgate.config.json: |
    {
      "host": "0.0.0.0",
      "port": 8787,

      "upstreams": {
        "openai": "https://api.mistral.ai",
        "anthropic": "https://api.anthropic.com"
      },

      "redaction": {
        "defaultPolicy": "pseudonymize",
        "policies": { "SECRET": "block" }
      },

      "residency": {
        "mode": "sanitize",
        "allow": [
          {
            "endpoint": "https://api.mistral.ai",
            "jurisdiction": "FR",
            "legalBasis": "REPLACE ME: the DPA and transfer basis you actually rely on"
          },
          {
            "endpoint": "https://api.anthropic.com",
            "jurisdiction": "US",
            "legalBasis": "REPLACE ME: the transfer basis for the Anthropic route, or delete this entry and point upstreams.anthropic at an EU endpoint",
            "note": "A third-country transfer. hushgate still redacts before sending; assess it or remove the route."
          }
        ]
      },

      "attachments": {
        "enabled": true,
        "onUnreadable": "block",
        "extractors": [
          {
            "mediaTypes": ["application/pdf"],
            "formats": ["pdf"],
            "command": "pdftotext",
            "args": ["-q", "-enc", "UTF-8", "-", "-"],
            "timeoutMs": 20000
          }
        ]
      },

      "audit": {
        "enabled": true,
        "path": "/var/lib/hushgate/hushgate-audit.jsonl"
      },

      "organisation": {
        "name": "REPLACE ME",
        "contact": "REPLACE ME",
        "purposes": ["REPLACE ME"]
      },

      "tenants": [
        {
          "id": "default",
          "name": "Default tenant",
          "keyEnv": "HUSHGATE_TENANT_KEY",
          "quotas": { "requestsPerMinute": 600 }
        }
      ]
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: hushgate-secrets
  labels:
    app.kubernetes.io/name: hushgate
type: Opaque
stringData:
  # Mint this with: hushgate keys new default
  HUSHGATE_TENANT_KEY: 'REPLACE ME'
  # The provider credential hushgate uses upstream. Callers never see it.
  OPENAI_API_KEY: 'REPLACE ME'
  ANTHROPIC_API_KEY: 'REPLACE ME'
  # Keeps hashed values stable across restarts.
  HUSHGATE_HMAC_KEY: 'REPLACE ME'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hushgate-audit
  labels:
    app.kubernetes.io/name: hushgate
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hushgate
  labels:
    app.kubernetes.io/name: hushgate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hushgate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hushgate
      annotations:
        # NOTE: /metrics requires a tenant key as soon as any tenant is defined,
        # and this ConfigMap defines one. Annotation-based scraping sends no
        # Authorization header, so these three alone will get 401 on every
        # scrape. Use a ServiceMonitor (or a scrape_config) that presents the
        # key instead, e.g.:
        #
        #   bearerTokenSecret:
        #     name: hushgate-secrets
        #     key: HUSHGATE_TENANT_KEY
        #
        # and drop these annotations once it is in place.
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '8787'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hushgate
          image: hushgate:0.1.0
          imagePullPolicy: IfNotPresent
          args: ['serve']
          ports:
            - name: http
              containerPort: 8787
          envFrom:
            - secretRef:
                name: hushgate-secrets
          # Everything under `limits` in the ConfigMap is policy and belongs
          # there, where it can be reviewed next to the quotas it bounds. This
          # one variable is the exception: HUSHGATE_IDLE_TIMEOUT_MS overrides
          # limits.idleTimeoutMs from the ConfigMap, and exists so an operator
          # can stretch how long a connection may sit silent between bytes
          # without touching the reviewed policy file. Uncomment for clients
          # that hold requests open a long while before streaming (ten minutes
          # here):
          #
          # env:
          #   # Ten minutes of allowed silence between bytes.
          #   HUSHGATE_IDLE_TIMEOUT_MS: '600000'
          #
          # Before you do, know what you are trading: an idle connection costs
          # almost nothing in memory or CPU — the resource limits above do not
          # need raising for it — but it holds a file descriptor for as long
          # as it stays open, and that is exactly the shape of a slowloris. The
          # reaper closes stalled connections on its own schedule rather than
          # yours, so a burst of held connections can exhaust the process's
          # nofile limit long before either resource limit moves. Kubernetes
          # has no per-container ulimit knob; raise it where the container
          # runtime lets you (LimitNOFILE on the kubelet for containerd/CRI-O),
          # or accept the default and keep the idle timeout tight.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          # Attachments raise the ceiling: a request may carry 16 MiB of body,
          # which is decoded, extracted and re-serialised, and pdftotext runs
          # beside it. 512Mi holds a handful of concurrent document requests;
          # raise it, or lower attachments.maxBytes, if yours are larger.
          # /tmp below is a writable emptyDir, which the extractor subprocess
          # needs given readOnlyRootFilesystem.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /app/hushgate.config.json
              subPath: hushgate.config.json
              readOnly: true
            - name: audit
              mountPath: /var/lib/hushgate
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: hushgate-config
        - name: audit
          persistentVolumeClaim:
            claimName: hushgate-audit
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hushgate
  labels:
    app.kubernetes.io/name: hushgate
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hushgate
  ports:
    - name: http
      port: 8787
      targetPort: http
