name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run tells you nothing, so do not pay for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint, build and test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor is the engines field; the ceiling is current.
        node: ['20.x', '22.x', '24.x']

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # The build config excludes the tests; this covers them too.
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check the banner and the documentation links
        # Neither tsc nor the tests notice a renamed file behind a README link
        # or a banner that stopped being valid SVG. This does.
        run: npm run check:docs

      - name: Prove the suite needs no network
        # Every test binds to 127.0.0.1 and talks to a fake upstream. If that
        # ever stops being true, this step is where it shows up.
        run: npm test
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
